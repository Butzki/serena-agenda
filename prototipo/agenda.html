<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agenda do dia · Serena Agenda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="agenda">
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <header class="topo"><div style="flex:1"><span class="marca">Serena Agenda</span><h1>Agenda</h1></div></header>
    <main id="conteudo">
      <p id="toast" class="alerta alerta-ok" role="status"></p>
      <div class="datas" style="margin-top:12px">
        <a id="anterior" class="icone-btn" href="#" aria-label="Dia anterior" style="text-decoration:none">‹</a>
        <div class="atual" aria-live="polite"><strong id="dia-semana"></strong><span id="dia-resto" class="suave"></span></div>
        <a id="proximo" class="icone-btn" href="#" aria-label="Próximo dia" style="text-decoration:none">›</a>
      </div>
      <div class="resumo" role="group" aria-label="Resumo do dia">
        <div><b id="n-ocupados">0</b><span class="suave">ocupados</span></div>
        <div><b id="n-livres" style="color:var(--cor-sucesso)">0</b><span class="suave">janelas livres</span></div>
      </div>
      <a id="novo" class="btn btn-primario btn-bloco" style="margin-top:16px" href="novo-agendamento.html">＋ Novo agendamento</a>
      <div id="vazio" class="vazio cartao" style="margin-top:16px" hidden>
        <h2>Nenhum agendamento neste dia</h2>
        <p class="suave">O dia inteiro está livre. Toque em “Novo agendamento” para começar.</p>
      </div>
      <ul id="lista" class="lista" aria-label="Agenda do dia"></ul>
    </main>
    <nav class="nav-inf" aria-label="Navegação principal">
      <a href="agenda.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
      <a href="servicos.html" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/></svg>Serviços</a>
    </nav>
  </div>
  <dialog id="dialogo" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2><p></p>
    <div class="botoes">
      <button type="button" class="btn ok btn-primario"></button>
      <button type="button" class="btn btn-secundario nao" autofocus>Voltar</button>
    </div>
  </dialog>
  <script src="js/app.js"></script>
</body>
</html>
