<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Novo agendamento · Serena Agenda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="novo-agendamento">
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <header class="topo"><a id="voltar" class="voltar" href="agenda.html" aria-label="Voltar para a agenda">←</a><h1>Novo agendamento</h1></header>
    <main id="conteudo">
      <div id="alerta-conflito" class="alerta alerta-perigo" role="alert" tabindex="-1" style="margin-bottom:16px"></div>
      <form id="form" novalidate>
        <div class="campo" id="c-cliente">
          <label for="cliente">Nome da cliente</label>
          <input id="cliente" name="cliente" type="text" autocomplete="off" required>
          <p class="erro" id="e-cliente"></p>
        </div>
        <div class="campo" id="c-telefone">
          <label for="telefone">Telefone (WhatsApp)</label>
          <input id="telefone" name="telefone" type="tel" inputmode="tel" placeholder="(49) 99999-9999" autocomplete="off" required>
          <p class="erro" id="e-telefone"></p>
        </div>
        <div class="campo" id="c-servico">
          <label for="servico">Serviço</label>
          <select id="servico" name="servico" required></select>
          <p class="erro" id="e-servico"></p>
        </div>
        <div class="linha">
          <div class="campo" id="c-data">
            <label for="data">Data</label>
            <input id="data" name="data" type="date" required>
            <p class="erro" id="e-data"></p>
          </div>
          <div class="campo" id="c-hora">
            <label for="hora">Hora</label>
            <input id="hora" name="hora" type="time" step="900" required>
            <p class="erro" id="e-hora"></p>
          </div>
        </div>
        <p class="alerta alerta-info">Guardamos só nome e telefone, para organizar a agenda do salão.</p>
        <div class="rodape-form">
          <button class="btn btn-primario btn-bloco" type="submit">Salvar agendamento</button>
          <a class="btn btn-secundario btn-bloco" href="agenda.html">Cancelar</a>
        </div>
      </form>
    </main>
    <nav class="nav-inf" aria-label="Navegação principal">
      <a href="agenda.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
      <a href="servicos.html" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/></svg>Serviços</a>
    </nav>
  </div>
  <dialog id="dialogo" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2><p></p>
    <div class="botoes">
      <button type="button" class="btn ok btn-primario"></button>
      <button type="button" class="btn btn-secundario nao" autofocus>Voltar</button>
    </div>
  </dialog>
  <script src="js/app.js"></script>
</body>
</html>
