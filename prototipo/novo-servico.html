<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Novo serviço · Serena Agenda</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="novo-servico">
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="app">
    <header class="topo"><a class="voltar" href="servicos.html" aria-label="Voltar para serviços">←</a><h1 id="titulo">Novo serviço</h1></header>
    <main id="conteudo">
      <form id="form" novalidate>
        <div class="campo" id="c-nome">
          <label for="nome">Nome do serviço</label>
          <input id="nome" name="nome" type="text" autocomplete="off" required>
          <p class="erro" id="e-nome"></p>
        </div>
        <div class="linha">
          <div class="campo" id="c-duracao">
            <label for="duracao">Duração (min)</label>
            <input id="duracao" name="duracao" type="text" inputmode="numeric" placeholder="60" required>
            <p class="erro" id="e-duracao"></p>
          </div>
          <div class="campo" id="c-preco">
            <label for="preco">Preço</label>
            <input id="preco" name="preco" type="text" inputmode="numeric" placeholder="R$ 0,00" required>
            <p class="erro" id="e-preco"></p>
          </div>
        </div>
        <div class="rodape-form">
          <button class="btn btn-primario btn-bloco" type="submit">Salvar serviço</button>
          <a class="btn btn-secundario btn-bloco" href="servicos.html">Cancelar</a>
          <button id="excluir" class="btn btn-perigo btn-bloco" type="button" hidden>Excluir serviço</button>
        </div>
      </form>
    </main>
    <nav class="nav-inf" aria-label="Navegação principal">
      <a href="agenda.html" ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
      <a href="servicos.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 19M8.5 16 20 5"/></svg>Serviços</a>
    </nav>
  </div>
  <dialog id="dialogo" aria-labelledby="dlg-t">
    <h2 id="dlg-t"></h2><p></p>
    <div class="botoes">
      <button type="button" class="btn ok btn-primario"></button>
      <button type="button" class="btn btn-secundario nao" autofocus>Voltar</button>
    </div>
  </dialog>
  <script src="js/app.js"></script>
</body>
</html>
